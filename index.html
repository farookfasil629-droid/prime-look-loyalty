<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PRIME LOOK | Loyalty</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101010;
      color: white;
      text-align: center;
    }
    header {
      padding: 25px 15px;
      border-bottom: 1px solid #a88b45;
    }
    h1 { color: #d8b86a; letter-spacing: 3px; }
    .hero { padding: 75px 20px; }
    .hero h2 { font-size: 32px; }
    p { color: #ccc; line-height: 1.7; }
    .btn {
      display: inline-block;
      padding: 14px 28px;
      margin-top: 20px;
      background: #d8b86a;
      color: #111;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }
    .card {
      margin: 20px auto;
      padding: 25px;
      max-width: 400px;
      border: 1px solid #a88b45;
      border-radius: 12px;
    }
    footer { padding: 30px; color: #999; }
  </style>
</head>
<body>
  <header>
    <h1>PRIME LOOK</h1>
    <p>Premium Shopping & Loyalty Rewards</p>
  </header>

  <main>
    <section class="hero">
      <h2>Welcome to PRIME LOOK</h2>
      <p>Shop with style. Earn rewards.</p>
      <a class="btn" href="#loyalty">
        Explore Loyalty
      </a>
    </section>

    <section id="loyalty" class="card">
      <h2>PRIME LOOK Loyalty Card</h2>
      <p>
        Your rewards journey starts here.
        Our loyalty features are coming soon.
      </p>
    </section>
  </main>

  <footer>
    &copy; 2026 PRIME LOOK.
    All rights reserved.
  </footer>
</body>
</html>
